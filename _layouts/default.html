<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <aside class="profile" aria-label="Researcher profile">
        <a class="profile-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="profile-role">{{ site.profile.position }}</div>
        <div class="profile-affiliation">{{ site.profile.affiliation }}</div>

        <img class="profile-photo" src="{{ site.profile.photo | relative_url }}" alt="Portrait of {{ site.title }}">

        <div class="profile-meta">{{ site.profile.location }}</div>

        <nav class="side-nav" aria-label="Main navigation">
          {% for item in site.data.navigation.main %}
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>

        <div class="profile-links">
          <a href="mailto:{{ site.profile.email }}">Email</a>
          <span aria-hidden="true">·</span>
          <a href="{{ site.profile.scholar }}">Google Scholar</a>
          <span aria-hidden="true">·</span>
          <a href="{{ site.profile.github }}">GitHub</a>
        </div>
      </aside>

      <main class="content">
        {% if page.title and page.title != "" %}<h1>{{ page.title }}</h1>{% endif %}
        {{ content }}
      </main>
    </div>
  </body>
</html>
