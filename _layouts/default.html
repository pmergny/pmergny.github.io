<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <script>
      // Dark is the site's default. A manual choice is remembered across pages.
      const savedTheme = localStorage.getItem("theme");
      document.documentElement.dataset.theme = savedTheme || "dark";
    </script>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <nav class="top-nav" aria-label="Main navigation">
          {% for item in site.data.navigation.main %}
            <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
              {{ item.title }}
            </a>
          {% endfor %}
        </nav>

        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">☀</button>
      </div>
    </header>

    <div class="site-shell">
      <aside class="profile" aria-label="Researcher profile">
        <img class="profile-photo" src="{{ site.profile.photo | relative_url }}" alt="Portrait of {{ site.title }}">

        <div class="profile-role">{{ site.profile.position }}</div>
        <div class="profile-affiliation">{{ site.profile.affiliation }}</div>
        <div class="profile-meta">{{ site.profile.location }}</div>

        <div class="profile-links icon-links" aria-label="Contact and academic profile">
          <a class="icon-link" href="mailto:{{ site.profile.email }}" aria-label="Email" title="Email">
            <img src="{{ '/assets/icons/email.svg' | relative_url }}" alt="">
          </a>
          <a class="icon-link" href="{{ site.profile.scholar }}" aria-label="Google Scholar" title="Google Scholar" target="_blank" rel="noopener">
            <img src="{{ '/assets/icons/scholar.svg' | relative_url }}" alt="">
          </a>
        </div>
      </aside>

      <main class="content">
        {% if page.title and page.title != "" %}<h1>{{ page.title }}</h1>{% endif %}
        {{ content }}
      </main>
    </div>

    <script>
      const button = document.getElementById("theme-toggle");

      function updateThemeIcon() {
        button.textContent = document.documentElement.dataset.theme === "dark" ? "☀" : "☾";
      }

      updateThemeIcon();

      button.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("theme", next);
        updateThemeIcon();
      });
    </script>
  </body>
</html>
